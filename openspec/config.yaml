schema: spec-driven

context: |
  Language: de
  All artifacts must be written in de.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: "Essenplaner" - Web-App, mit der eine Familie pro Kalenderwoche
  festlegt, was es an jedem Tag zum Abendessen gibt. Rezepte werden von Hand
  angelegt oder direkt aus Rezeptseiten per URL importiert.
  Nachfolger des Prototyps "family-dinner-planner" (Go + React), aus dem
  Muster und Code uebernommen werden duerfen.

  Nutzer: eine Familie (wenige Personen), ueberwiegend am Smartphone.
  Betrieb: oeffentlich im Internet erreichbar. Bis zum Auth0-Login schuetzt
  voruebergehend HTTP Basic Auth den Zugang; danach haben nur freigegebene
  E-Mail-Adressen Zugriff.

  Stack:
  - frontend/: React + TypeScript (Vite), Tests mit Vitest + Testing Library
  - backend/: Go, net/http aus der Standardbibliothek, SQLite
  - Ein deploybares Artefakt: das Go-Binary liefert API und gebautes Frontend aus
  - UI-Texte auf Deutsch, Code und Bezeichner auf Englisch

  Reihenfolge der Changes: add-frontend-mock-data -> add-go-backend ->
  add-recipe-url-import -> add-recipe-editor -> add-planner-flexibility ->
  add-servings-scaling -> add-shopping-list -> add-recipe-organization -> add-menus ->
  add-cooking-view -> add-vps-deployment -> add-auth0-login.
  Optionale, den Kernpfad nicht blockierende Folge-Changes sind add-freezer
  und add-nutrition. Beide koennen unabhaengig voneinander umgesetzt werden.
  Ein Change wird erst umgesetzt und archiviert, bevor der naechste startet.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
